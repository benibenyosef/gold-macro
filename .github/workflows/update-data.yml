name: Update Gold Macro Data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update free market data
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "gold-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Auto update gold macro data"
            git push
          fi
